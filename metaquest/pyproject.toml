[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superdex-quest-teleop"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Meta Quest hand-tracking teleoperation and contact/force data recording for SuperDex"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "superdex-physics",
    "superdex-robotics",
    "numpy",
    "aiohttp>=3.9",
    "h5py>=3.10",
    "cryptography",  # self-signed HTTPS certificate when the openssl CLI is missing
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
superdex-quest-teleop = "superdex_quest_teleop.__main__:main"

[tool.setuptools]
packages = ["superdex_quest_teleop"]

[tool.setuptools.package-data]
superdex_quest_teleop = ["web/*.html", "web/*.js", "web/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
